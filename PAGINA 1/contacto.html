<!-- Cuerpo - Banner -->

    <div class="container">

    <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-7">

        <h1 class="text-center">Contacto</h1>

         <p class="text-center">
             ¿Tienes alguna consulta o quieres agendar un pedido? Enviame un mensaje.
         </p>

             <!-- FORMULARIO -->

                <form action="contacto.html" method="get">

                 <div class="row g-3">

                    <!-- Nombre -->

                    <div class="col-12 col-md-6">

                         <label for="nombre" class="form-label">
                             Nombre
                        </label>

                        <input type="text" class="form-control" id="nombre" name="nombre"
                             placeholder="Ingresá tu nombre" required>

                    </div>

                     <!-- Apellido -->

                    <div class="col-12 col-md-6">

                         <label for="apellido" class="form-label">
                             Apellido
                         </label>

                        <input type="text" class="form-control" id="apellido" name="apellido"
                              placeholder="Ingresá tu apellido" required>

                    </div>

                     <!-- Correo -->

                    <div class="col-12">

                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email" class="form-control" id="correo" name="correo"
                              placeholder="ejemplo@correo.com" required>

                    </div>
                    <!-- Mensaje -->

                    <div class="col-12">

                        <label for="mensaje" class="form-label">
                             Mensaje
                        </label>

                        <textarea class="form-control" id="mensaje" name="mensaje"
                            rows="6" placeholder="Escribe tu mensaje" required></textarea>

                    </div>

                    <!-- Botón -->

                    <div class="col-12 text-center">

                        <button type="submit" class="btn btn-enviar">
                               Enviar
                         </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
